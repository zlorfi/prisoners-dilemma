services:
  app:
    # Tag is pinned by scripts/release.sh on each release.
    # The server needs only this file and a .env — no checkout, no build.
    image: ghcr.io/zlorfi/prisoners-dilemma:1.0.5
    container_name: prisoners-dilemma
    restart: unless-stopped
    # No ports published: Traefik reaches the container over the proxy network.
    # Uncomment to expose it directly on the host for debugging.
    # ports:
    #   - "${HOST_PORT:-3000}:3000"
    networks:
      - traefik-network
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /data
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      # Leave unset in .env to get a generated password printed to the logs.
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      # Behind Traefik with TLS these three must be set for correct links,
      # real client IPs in the rate limiter, and Secure cookies.
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-https://pd.zlor.fi}"
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      COOKIE_SECURE: "${COOKIE_SECURE:-1}"
      NAME_RESERVATION_MINUTES: "${NAME_RESERVATION_MINUTES:-45}"
    labels:
      - traefik.enable=true
      # Must match the network below, or Traefik may resolve the wrong IP.
      - traefik.docker.network=traefik-network
      - traefik.http.routers.prisoners-dilemma.rule=Host(`pd.zlor.fi`)
      - traefik.http.routers.prisoners-dilemma.entrypoints=websecure
      - traefik.http.routers.prisoners-dilemma.service=prisoners-dilemma
      - traefik.http.services.prisoners-dilemma.loadbalancer.server.port=3000
      - traefik.http.routers.prisoners-dilemma.tls=true
      - traefik.http.routers.prisoners-dilemma.tls.certresolver=letsencrypt-cloudflare
    volumes:
      # SQLite lives next to this compose file, so a backup is a plain file
      # copy. The directory must exist and be writable by uid 1000 (the
      # container's `node` user) before the first start:
      #   mkdir -p dilemma-data && sudo chown -R 1000:1000 dilemma-data
      # Otherwise Docker creates it as root and the app exits with EACCES.
      - ./dilemma-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 8s
    security_opt:
      - no-new-privileges:true

networks:
  # The network Traefik already runs on. `external: true` means compose joins
  # the existing one rather than creating a second, isolated network.
  traefik-network:
    external: true
    name: traefik-network
