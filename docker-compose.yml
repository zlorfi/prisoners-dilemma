services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: prisoners-dilemma:latest
    container_name: prisoners-dilemma
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /data
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      # Leave unset in .env to get a generated password printed to the logs.
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-}"
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
      NAME_RESERVATION_MINUTES: "${NAME_RESERVATION_MINUTES:-45}"
    volumes:
      # Named volume keeps the SQLite database across rebuilds.
      - dilemma-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 8s
    security_opt:
      - no-new-privileges:true

volumes:
  dilemma-data:
